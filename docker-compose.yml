version: '3.8'

services:
  mongodb:
    image: mongo:latest
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db

  redis:
    image: redis:alpine
    ports:
      - "6379:6379"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGO_URI=mongodb+srv://thnhphong4869_db_user:nzo70e9IphStVBtL@cluster0.o5tvdb0.mongodb.net/?appName=Cluster0
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=local_jwt_secret
      - EMAIL_USER=test@example.com
      - EMAIL_PASS=testpass123
      - CLOUDINARY_CLOUD_NAME=local_cloudinary_name
      - CLOUDINARY_API_KEY=local_cloudinary_api_key
      - CLOUDINARY_API_SECRET=local_cloudinary_api_secret
      - FRONTEND_URL=http://localhost:8080
      - FRONTEND_URL_2=http://127.0.0.1:8080
    depends_on:
      - mongodb
      - redis

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  mongodb_data:
